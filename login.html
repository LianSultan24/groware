<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Grocery Warehouse Management System</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <div class="login-wrapper">

        <div class="login-card">

            <div class="login-brand">
                <div class="login-logo">GW</div>
                <h1>Grocery Warehouse</h1>
                <p>Management System</p>
            </div>

            <form id="login-form" onsubmit="return false;">

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter your username" autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
                </div>

                <button type="button" id="btn-login" class="btn btn-primary btn-block">Log In</button>

            </form>

            <p class="login-note">
                Accounts are created by the Administrator only.<br>
                No public sign-up is available for this system.
            </p>

        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.8/axios.min.js"></script>
    <script src="login.js"></script>
</body>
</html>
</html>
